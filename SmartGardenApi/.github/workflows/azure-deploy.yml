name: Deploy to Azure App Service

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: smartgarden   # Nome do teu App Service no Azure
  DOTNET_VERSION: '9.0.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Verify project structure
      run: |
        echo "Current directory: $(pwd)"
        echo "Files in root:"
        ls -la
        if [ ! -f "SmartGardenApi/SmartGardenApi.csproj" ]; then
          echo "ERROR: SmartGardenApi/SmartGardenApi.csproj not found!"
          exit 1
        fi

    - name: Restore dependencies
      run: dotnet restore SmartGardenApi/SmartGardenApi.csproj

    - name: Build with dotnet
      run: dotnet build SmartGardenApi/SmartGardenApi.csproj --configuration Release --no-restore

    - name: Publish
      run: dotnet publish SmartGardenApi/SmartGardenApi.csproj --configuration Release --no-build --output ./publish

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: ./publish
        
    - name: Restart Azure Web App
      if: success()
      run: |
        echo "Deployment completed successfully"
