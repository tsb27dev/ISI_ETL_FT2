# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - smartgarden

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_PATH: './SmartGardenApi'
  PUBLISH_OUTPUT: './publish'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Verify project exists
        run: |
          if [ ! -f "${{ env.PROJECT_PATH }}/SmartGardenApi.csproj" ]; then
            echo "ERROR: Project file not found at ${{ env.PROJECT_PATH }}/SmartGardenApi.csproj"
            ls -la ${{ env.PROJECT_PATH }}/
            exit 1
          fi

      - name: Restore dependencies
        run: dotnet restore "${{ env.PROJECT_PATH }}/SmartGardenApi.csproj"

      - name: Build with dotnet
        run: dotnet build "${{ env.PROJECT_PATH }}/SmartGardenApi.csproj" --configuration Release --no-restore

      - name: dotnet publish
        run: dotnet publish "${{ env.PROJECT_PATH }}/SmartGardenApi.csproj" -c Release -o ${{ env.PUBLISH_OUTPUT }}

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{ env.PUBLISH_OUTPUT }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C7D50257927C4986BBA2F6C165993C74 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_6AE39DA0976E49F3B341591C55322ED7 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A2887934B41B4F22ACACDD2A98E896B7 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'smartgarden'
          slot-name: 'Production'
          package: .
